apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: front-end-app
  namespace: argocd
spec:
  project: smap
  source:
    repoURL: "https://github.com/tomeko19/smap-platform.git"
    targetRevision: dev
    path: front-end/apps/deployment    
  destination:
    server: https://kubernetes.default.svc
    namespace: smap
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        maxDuration: 3m0s
        factor: 2  