apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-inject-admin-token
  namespace: smap
data:
  handler.lua: |
    local http = require "resty.http"
    local cjson = require "cjson.safe"

    -- read secret of file
    local function read_file(path)
      local f, err = io.open(path, "r")
      if not f then
        kong.log.err("could not open file", path, ":", err)
        return nil
      end
      local content = f:read("*a")
      return content and content:gsub("%s+$", "")
    end

    local plugin = {
      PRIORITY = 900
      VERSION = "1.0",
    }

    function plugin:access(plugin_conf)
      kong.log.inspect("inject-admin-token plugin begining")
      kong.log.inspect("token_url: " .. plugin_conf.token_url)

      -- 1) read client_id, username, password from secret
      local base_path = "/etc/secrets/admin"
      local client_id = read_file(base_path .. "CLIENT_ID")
      local username = read_file(base_path .. "USERNAME")
      local password = read_file(base_path .. "PASSWORD")

      if not client_id or client_id== "" then
        kong.log.err("CLIENT_ID not found or empty at ", base_path .. "CLIENT_ID")
        return kong.response.exit(500, { message = "CLIENT_ID not configured" })
      end
      if not username or username == "" then
      kong.log.err(" USERNAME not found or empty at ", base_path .. "USERNAME")
        return kong.response.exit(500, { message = "USERNAME not configured" })
      end 
       if not password or password == "" then
      kong.log.err(" PASSWORD not found or empty at ", base_path .. "PASSWORD")
        return kong.response.exit(500, { message = "PASSWORD not configured" })
      end  

      -- 2) perform HTTP POST to retrieve token 
      local httpc = http.new()
      httpc:set_timeout(10000) -- 10 secondes

      local res, err = httpc:request_uri(plugin_conf.token_url,{
        method = "POST",
        body = ngx.encode_args({
          client_id = client_id,
          username = username,
          password = password,
          grant_type = "password",  
        }),
        headers = {
          ["Content-Type"] = "application/x-www-form-urlencoded"
        }
      
      })

      if not res then 
        kong.log.err("Failed to connect to token URL: ", err or "unknown error")
        return kong.response.exit(500, { message = "Failed to get token: " .. (err or "connection error") })
      end

      kong.log.inspect("HTTP status: " .. res.status)
      kong.log.inspect("Response body: " .. (res.body or "empty"))

      if res.status ~= 200 then
        kong.log.err("Token request failed with status: ", res.status)
        return kong.response.exit(500, { message = "Unable to fetch token" })
      end

      local token_data, decode_err = cjson.decode(res.body)
      if not token_data then
        kong.log.err("Failed to decode token response: ", decode_err or "unknown error")
        return kong.response.exit(500, { message = "Invalid token response" })
      end

      local token = token_data and token_data.access_token
      if token then 
        kong.log.inspect("Token obtained successfully")
        kong.service.request.set_header("Authorization", "Bearer " .. token)
      else
        kong.log.err("No access_token in response")
        return kong.response.exit(500, { message = "No access token in response" })
      end
    end  
    
    return plugin

  schema.lua: |
    local typedefs = require "kong.db.schema.typedefs"
    return {
      name = "inject-admin-token",
      fields = {
        { config = {
            type = "record",
            fields = {
              {
                token_url = typedefs.url {
                  required = true,
                  description = "URL to fetch the token (grant_type=password)"
                }
              },
            },
          },
        },
      },
    }
        