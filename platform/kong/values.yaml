env:
  database: "off"
  declarative_config: "/config/kong.yml"
  proxy_access_log: /dev/stdout
  admin_access_log: /dev/stdout
  admin_gui_access_log: /dev/stdout
  portal_api_access_log: /dev/stdout
  proxy_error_log: /dev/stderr
  admin_error_log: /dev/stderr
  admin_gui_error_log: /dev/stderr
  portal_api_error_log: /dev/stderr
  admin_gui_url: "http://34.154.111.227:8002"
  admin_gui_api_url: "http://34.154.244.170:8001"
  admin_listen: "0.0.0.0:8444 ssl, 0.0.0.0:8001"
  KONG_LUA_PACKAGE_PATH: "/opt/kong/plugins/?.lua;/opt/kong/plugins/?/init.lua;;"

plugins:
  names:
    - bundled
    - inject-admin-token

  configMaps:
    - pluginName: inject-admin-token
      name: kong-inject-admin-token   

ingressController:
  enabled: false

manager:
  enabled: true
  type: NodePort

admin:
  enabled: true
  type: NodePort
  http:
    enabled: true
    servicePort: 8001

proxy:
  enabled: true
  type: NodePort
  http:
    enabled: true
    servicePort: 8000

extraConfigMaps:
- name: kong-config
  mountPath: /config/kong.yml
  subPath: kong.yml

extraSecrets:
  - name: kong-token-inject-secret
    mountPath: /etc/secrets/admin 