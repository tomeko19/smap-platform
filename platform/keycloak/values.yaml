image:
  repository: quay.io/keycloak/keycloak
  tag: "24.0.1"

command:
  - "/opt/keycloak/bin/kc.sh"
  - "start-dev"

auth:
  adminUser: admin
  adminPassword: admin

proxy: edge

http:
  relativePath: /auth

postgresql:
  enabled: false

startupProbe: |
  httpGet:
    path: /health/started
    port: http
  failureThreshold: 60
  periodSeconds: 5

readinessProbe: |
  httpGet:
    path: /health/ready
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe: |
  httpGet:
    path: /health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10
