image:
  repository: quay.io/keycloak/keycloak
  tag: "24.0.1"

command:
  - "/opt/keycloak/bin/kc.sh"
  - "start"

auth:
  adminUser: admin
  adminPassword: admin

proxy: edge

http:
  relativePath: /

postgresql:
  enabled: false

extraEnv: |
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_PROXY
    value: "edge"
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_HTTP_PORT
    value: "8080"

