image:
  repository: quay.io/keycloak/keycloak
  tag: "24.0.1"

command:
  - "/opt/keycloak/bin/kc.sh"
  - "start-dev"

auth:
  adminUser: admin
  adminPassword: admin

proxy: edge

http:
  relativePath: /auth

postgresql:
  enabled: false

startupProbe:
  httpGet:
    path: /auth/health/started
    port: http
  initialDelaySeconds: 30
  failureThreshold: 120
  periodSeconds: 5

readinessProbe:
  httpGet:
    path: /auth/health/ready
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /auth/health/live
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

extraEnv: |
  - name: KC_HTTP_ENABLED
    value: "true"
  - name: KC_HTTP_PORT
    value: "8080"
